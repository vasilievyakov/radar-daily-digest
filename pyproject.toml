[project]
name = "radar"
version = "0.1.0"
description = "Daily digest agent for changes in AI tooling"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "feedparser>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: touches the real Claude CLI; skipped unless explicitly enabled",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

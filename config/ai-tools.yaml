    label: "modelcontextprotocol/servers"
    vendor: mcp
    type: github_releases
    url: https://github.com/modelcontextprotocol/servers
    priority: 3
    enabled: true
    backfill_supported: true
    backfill_depth_days: 540
    min_expected_items: 1

  - id: gh_n8n
    label: "n8n"
    vendor: n8n
    type: github_releases
    url: https://github.com/n8n-io/n8n
    priority: 3
    enabled: true
    backfill_supported: true
    backfill_depth_days: 180
    min_expected_items: 5

  # Монорепо: почти каждый релиз это версия отдельного пакета-интеграции.
  # Объём есть, плотность полезного на запись низкая.
  - id: gh_langchain
    label: "LangChain"
    vendor: langchain
    type: github_releases
    url: https://github.com/langchain-ai/langchain
    priority: 3
    enabled: true
    backfill_supported: true
    backfill_depth_days: 180
    min_expected_items: 5

collection:
  window_hours: 26
  timeout_seconds: 30
  max_retries: 2
  polite_delay_seconds: 1.0

retrieval:
  windows: [180, 365]
  required_filters: [vendor, change_type]
  max_results_per_cluster: 12
  min_evidence_for_trend: 2
  # Второй запрос по смежным типам. Строгий фильтр институционализирует
  # ложноотрицательный результат; расширенный делает пропуск видимым числом.
  relaxed_change_type_groups:
    - [pricing, limits]
    - [deprecation, breaking_change]

trends:
  min_members: 3
  dormant_after_days: 90

scoring:
  # Vendors and products the reader actually builds on. Drives the stack
  # overlap factor; without it that factor never fires.
  active_stack:
    - anthropic
    - openai
    - cursor
    - n8n
    - mcp
  urgency_horizon_days: 90
  weights:
    change_type:
      breaking_change: 30
      deprecation: 30
      security: 25
      limits: 18
      pricing: 18
      release: 10
      other: 4
    stack_overlap: 20
    urgency: 20
    source_authority: 15
    novelty:
      new: 15
      updated: 12
      continuing: 4
      resolved: 6
  publish_threshold: 55
  digest_threshold: 35

# Стадия 3. Модель возвращает число 0-100 и о пороге не знает вообще:
# порог применяет код, иначе FR-3.4 невыполним — у бинарного вердикта
# модели порога не существует, и «порог в конфиге» остаётся декларацией.
filter:
  threshold: 55
  # SRC-2: материал приоритета 5 без подтверждения из приоритета 1-3
  # теряет столько очков. Ни одна другая стадия это требование не проверяет.
  uncorroborated_penalty: 30
  # Пакетирование окупается на CLI вчетверо: кэшируемый префикс со словарём
  # вендоров доминирует над самим материалом, и на пачку он оплачивается раз.
  batch_size: 8

enrichment:
  fact_kinds: [version, effective_date, sunset_date, price, limit, affected_product]
  require_evidence: true
  max_evidence_words: 15

delivery:
  channels: [telegram, email]
  schedule: "0 8 * * *"
  timezone: "Europe/Moscow"
  max_items_telegram: 5
  quiet_day_message: true
  # The reader's dial. Everything the core judged significant is published
  # either way; this is what is worth interrupting a morning for. Empty means
  # everything. A quiet day and a failed run always arrive: those are
  # statements about the agent itself, and silencing them is how a dead agent
  # looks healthy.
  wake_me_for: []          # например: [deprecation, breaking_change, pricing]
  min_tier: ""             # "", standard или lead

# Backend selection. The local Claude Code CLI is the working backend; the
# OpenRouter client takes over automatically once OPENROUTER_API_KEY exists.
# Both share one call cache keyed by (model, prompt, schema, params), so a
# corpus built on one backend is not re-paid for on the other.
llm:
  backend: auto        # auto | claude_cli | openrouter
  # Measured over a full run: 424k output tokens paid for, 74k of JSON
  # actually parsed — 17% arrives. The rest is reasoning the pipeline never
  # sees, and it is what pushed calls from 30 seconds to four minutes and
  # into the timeout. Extraction returns structured events; it does not need
  # room to think out loud.
  max_output_tokens: 4000
  # Above the largest legitimate call measured (165 s), so a timeout means a
  # stuck process rather than work being cut off mid-answer.
  timeout_seconds: 240
  max_schema_retries: 2
  # Concurrent batches, not concurrent records. One source is split into
  # batches of this size so a single large source stops being the tail:
  # github_changelog alone is 871 of the 2405 materials.
  concurrency: 8
  batch_size: 100

# Stage to model routing. Measured CLI cost per call with a warm prefix cache:
# haiku about $0.005, and the first call of a stage pays roughly $0.033 to
# create that cache. The system prompt of a stage must therefore stay byte
# identical between calls, otherwise every call pays creation instead of read.
#
# Scoring and clustering have no model at all: weights stop being weights once
# a model applies them (FR-6.3), and a cluster key assigned by a model drifts
# between runs, which quietly breaks days_tracked.
models:
  cluster: null
  filter: anthropic/claude-haiku-4.5
  # Measured on a live smoke run: sonnet costs about $0.053 per material on
  # real page sections, haiku about a tenth of that. Bulk enrichment on sonnet
  # would put the backfill near $150, so the cheap model carries the volume.
  enrich: anthropic/claude-haiku-4.5
  # Dates and sunset windows are what the whole product is judged on, so the
  # deprecation path gets the stronger model while bulk enrichment does not.
  enrich_critical: anthropic/claude-sonnet-5
  trends: anthropic/claude-sonnet-5
  score: null
  embeddings: openai/text-embedding-3-small

# Change types routed to enrich_critical rather than enrich.
critical_change_types: [deprecation, breaking_change, security]

budget:
  # NFR-5 target for a daily run: roughly 40 materials through the filter on
  # haiku plus a dozen enrichments on sonnet.
  max_usd_per_run: 0.50
  # Backfill is the one large spend of the project and runs once. Measured on
  # the real cache: priority 1 gives 2405 materials, of which about 692 are
  # critical. Mixed routing puts those on sonnet (~$10) and the rest on haiku
  # (~$9), so roughly $19. The limit carries headroom so the run stops on its
  # own terms rather than mid-corpus.
  max_usd_per_backfill: 50.00
  # Second line of defence handed to the CLI itself, per call.
  max_usd_per_call: 0.50
  stop_on_exceed: true

# Обнаружение источников. Отдельный процесс, а не стадия пайплайна: растущий
# репозиторий не является изменением в отслеживаемом продукте, у него нет ни
# даты события, ни факта для извлечения, и в дайджест он не попадает никогда.
# Его роль — предлагать пополнение списка источников, потому что список
# вендоров заморожен вручную и через полгода устареет.
scout:
  topics: [llm, ai-agents, mcp, rag, llmops, agentic-ai]
  min_stars: 4000
  # Прирост считается между снимками: у GitHub нет эндпоинта trending,
  # а сортировка по звёздам возвращает тех, кто и так был большим.
  min_stars_gained: 300
  # Без релизов у проекта нет структурированной датированной истории,
  # то есть источником он стать не может, сколько бы звёзд ни набрал.
  min_releases: 5
  schedule: "0 9 * * 1"

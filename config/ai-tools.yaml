      label: "Релиз"
    - id: breaking_change
      label: "Ломающее изменение"
    - id: deprecation
      label: "Объявление об отключении"
    - id: pricing
      label: "Изменение цены"
    - id: limits
      label: "Изменение лимитов"
    - id: security
      label: "Безопасность"

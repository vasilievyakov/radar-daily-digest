      label: "Прочее"

sources:
  # Приоритет 1: официальные реестры отключений и changelog.
  # Каждый адрес проверен curl: указано число уникальных дат на странице.

  # --- Anthropic ---
  - id: anthropic_model_deprecations
    label: "Anthropic model deprecations"
    vendor: anthropic
    type: html_scrape
    url: https://docs.claude.com/en/docs/about-claude/model-deprecations
    priority: 1
    enabled: true
    parser_hint: dated_table
    backfill_supported: true
    backfill_depth_days: 540
    min_expected_items: 10

  - id: anthropic_api_release_notes
    label: "Anthropic API release notes"
    vendor: anthropic
    type: html_scrape
    url: https://docs.claude.com/en/release-notes/api
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 540
    min_expected_items: 20

  # Дат мало, но это даты вступления тарифов в силу.
  - id: anthropic_pricing
    label: "Anthropic pricing"
    vendor: anthropic
    type: html_scrape
    url: https://docs.claude.com/en/docs/about-claude/pricing
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 540
    min_expected_items: 2

  # Редиректит на GitHub CHANGELOG.md без дат. Тот же материал приходит
  # структурированно через gh_anthropics_claude_code.
  - id: anthropic_claude_code_release_notes
    label: "Anthropic claude code release notes"
    vendor: anthropic
    type: html_scrape
    url: https://docs.claude.com/en/release-notes/claude-code
    priority: 1
    enabled: false
    parser_hint: dated_sections
    backfill_supported: false
    min_expected_items: 10

  # --- OpenAI ---
  - id: openai_deprecations
    label: "OpenAI deprecations"
    vendor: openai
    type: html_scrape
    url: https://platform.openai.com/docs/deprecations
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 540
    min_expected_items: 10

  # Двухуровневые даты: заголовок «June, 2025» задаёт год и месяц,
  # отметка «Jun 27» внутри задаёт день. 34 месячных заголовка, 154 отметки.
  - id: openai_changelog
    label: "OpenAI changelog"
    vendor: openai
    type: html_scrape
    url: https://platform.openai.com/docs/changelog
    priority: 1
    enabled: true
    parser_hint: month_then_day
    backfill_supported: true
    backfill_depth_days: 540
    min_expected_items: 10

  # --- Google ---
  # Домен уходит в цепочку OAuth-редиректов при браузерном User-Agent.
  # Наш UA не браузерный, менять его на этих источниках нельзя.
  - id: google_gemini_deprecations
    label: "Google gemini deprecations"
    vendor: google
    type: html_scrape
    url: https://ai.google.dev/gemini-api/docs/deprecations
    priority: 1
    enabled: true
    parser_hint: dated_table
    backfill_supported: true
    backfill_depth_days: 720
    min_expected_items: 10

  - id: google_gemini_changelog
    label: "Google gemini changelog"
    vendor: google
    type: html_scrape
    url: https://ai.google.dev/gemini-api/docs/changelog
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 540
    min_expected_items: 20

  - id: google_agent_platform_release_notes
    label: "Google agent platform release notes"
    vendor: google
    type: html_scrape
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 540
    min_expected_items: 10

  # Страница помечена как более не обновляемая: только для бэкфилла.
  - id: google_vertex_release_notes_archive
    label: "Google vertex release notes archive"
    vendor: google
    type: html_scrape
    url: https://cloud.google.com/vertex-ai/generative-ai/docs/release-notes
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 900
    min_expected_items: 30
    live_collect: false

  - id: google_vertex_model_versions
    label: "Google vertex model versions"
    vendor: google
    type: html_scrape
    url: https://cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions
    priority: 1
    enabled: true
    parser_hint: dated_table
    backfill_supported: true
    backfill_depth_days: 720
    min_expected_items: 10

  # --- GitHub ---
  # Главный источник по вендору: 833 записи за двенадцать месяцев, из них
  # 56 об отключениях, 57 о лимитах, 23 о ценах. Четыре ячейки одной лентой.
  # История берётся помесячным шаблоном, суточное окно — с корневой страницы.
  - id: github_changelog
    label: "GitHub changelog"
    vendor: github
    type: html_scrape
    url: https://github.blog/changelog/
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 365
    backfill_url_template: "https://github.blog/changelog/{year}/{month:02d}/"
    min_expected_items: 5

  - id: github_graphql_breaking_changes
    label: "GitHub GraphQL breaking changes"
    vendor: github
    type: html_scrape
    url: https://docs.github.com/en/graphql/overview/breaking-changes
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 900
    min_expected_items: 10

  - id: github_graphql_changelog
    label: "GitHub GraphQL changelog"
    vendor: github
    type: html_scrape
    url: https://docs.github.com/en/graphql/overview/changelog
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 720
    min_expected_items: 10

  # --- LangChain ---
  # Единственный источник с явными датами снятия: «scheduled for removal on».
  - id: langchain_changelog
    label: "LangChain changelog"
    vendor: langchain
    type: html_scrape
    url: https://changelog.langchain.com/
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 540
    min_expected_items: 20

  - id: langsmith_selfhosted_changelog
    label: "LangChain langsmith selfhosted changelog"
    vendor: langchain
    type: html_scrape
    url: https://docs.langchain.com/langsmith/self-hosted-changelog
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 365
    min_expected_items: 20

  # --- n8n ---
  - id: n8n_release_notes
    label: "n8n release notes"
    vendor: n8n
    type: html_scrape
    url: https://docs.n8n.io/release-notes/
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 365
    min_expected_items: 10

  # Ветка 1.x заморожена: 18 разделов breaking changes, ни одного за год.
  # Берётся только ради исторической глубины.
  - id: n8n_release_notes_1x_archive
    label: "n8n release notes 1x archive"
    vendor: n8n
    type: html_scrape
    url: https://docs.n8n.io/changelog/release-notes-1.x
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 900
    min_expected_items: 30
    live_collect: false

  # --- Cursor ---
  # Индекс постов лежит во встроенном JSON той же страницы. Единственный
  # способ получить датированную историю цен Cursor.
  - id: cursor_blog
    label: "Cursor blog"
    vendor: cursor
    type: html_scrape
    url: https://cursor.com/blog
    priority: 2
    enabled: true
    parser_hint: embedded_json_index
    backfill_supported: true
    backfill_depth_days: 720
    min_expected_items: 20

  # Проверено дважды: 191 КБ, шесть дат, из десяти адресов записей дату
  # кодирует один. Рендеринг не помогает. Оставлен выключенным.
  - id: cursor_changelog
    label: "Cursor changelog"
    vendor: cursor
    type: html_scrape
    url: https://cursor.com/changelog
    priority: 1
    enabled: false
    parser_hint: dated_sections
    backfill_supported: false
    min_expected_items: 3

  # --- MCP ---
  # Пять ревизий спецификации за всё время, две за последний год.
  # Ячейку не закрывает, но это единственный датированный след протокола.
  - id: mcp_spec_versioning
    label: "Model Context Protocol spec versioning"
    vendor: mcp
    type: html_scrape
    url: https://modelcontextprotocol.io/specification/versioning
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 900
    min_expected_items: 3

  # --- Провайдеры моделей и инференса ---
  # Восемь первоклассных реестров отключений, все берутся обычным curl.
  # Это самая ценная находка разведки: ячейка deprecation набирается
  # у десяти вендоров сразу.

  # 118 дат, глубина до 2028 года. Внимание на адрес: соседняя страница
  # concepts/model-retirements отдаёт 200 и содержит только политику,
  # таблица переехала сюда. По коду ответа их не различить.
  - id: azure_model_retirement_schedule
    label: "Microsoft AI azure model retirement schedule"
    vendor: microsoft_ai
    type: html_scrape
    # Moved: the old .../ai-foundry/openai/concepts/model-retirement-schedule
    # answers 404, and the fetcher had archived that 404 forever, so the
    # source read as fast and empty rather than broken.
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirements
    priority: 1
    enabled: true
    parser_hint: dated_table
    backfill_supported: true
    backfill_depth_days: 900
    min_expected_items: 20

  - id: together_deprecations
    label: "Together AI deprecations"
    vendor: together
    type: html_scrape
    url: https://docs.together.ai/docs/deprecations
    priority: 1
    enabled: true
    parser_hint: dated_table
    backfill_supported: true
    backfill_depth_days: 720
    min_expected_items: 10

  - id: together_changelog
    label: "Together AI changelog"
    vendor: together
    type: html_scrape
    url: https://docs.together.ai/docs/changelog
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 540
    min_expected_items: 20

  # Таблица требует формата дат M/D/YYYY: на ISO-шаблоне страница выглядит
  # мёртвой, хотя несёт 43 строки с датами объявления и вывода.
  - id: mistral_models
    label: "Mistral models"
    vendor: mistral
    type: html_scrape
    url: https://docs.mistral.ai/models
    priority: 1
    enabled: true
    parser_hint: dated_table
    backfill_supported: true
    backfill_depth_days: 720
    min_expected_items: 10

  - id: aws_bedrock_model_lifecycle
    label: "AWS Bedrock model lifecycle"
    vendor: aws
    type: html_scrape
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
    priority: 1
    enabled: true
    parser_hint: dated_table
    backfill_supported: true
    backfill_depth_days: 720
    min_expected_items: 10

  - id: google_model_versions
    label: "Google model versions"
    vendor: google
    type: html_scrape
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-versions
    priority: 1
    enabled: true
    parser_hint: dated_table
    backfill_supported: true
    backfill_depth_days: 900
    min_expected_items: 10

  - id: fireworks_changelog
    label: "Fireworks AI changelog"
    vendor: fireworks
    type: html_scrape
    url: https://docs.fireworks.ai/updates/changelog
    priority: 1
    enabled: true
    parser_hint: dated_sections
    backfill_supported: true
    backfill_depth_days: 540
    min_expected_items: 10

  # В сыром HTML 58 ISO-дат, в DOM остаётся 10-11: бэкфилл невозможен,
  # ежедневный сбор работает.
  - id: cohere_deprecations
    label: "Cohere deprecations"
    vendor: cohere
    type: html_scrape
    url: https://docs.cohere.com/docs/deprecations
    priority: 1
    enabled: true
    parser_hint: dated_table

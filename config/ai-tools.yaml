theme:
  name: "Изменения в AI-инструментах"
  description: >
    Изменения в продуктах и API инструментов, на которых практик ежедневно
    ведёт разработку: Claude Code, Anthropic API, OpenAI API, Cursor, n8n,
    MCP-серверы, SDK и CLI вокруг них.
  relevance_criteria: >
    Релевантно то, что меняет поведение работающего кода или условия его
    эксплуатации: выпуск версии, ломающее изменение, объявление об отключении,
    изменение цены, изменение лимитов, уязвимость и патч к ней.
  exclusion_criteria: >
    Нерелевантно: маркетинг без фактов, обзоры и мнения, слухи и утечки без
    первоисточника, новости об индустрии ИИ в целом, кадровые и инвестиционные
    новости, бенчмарки без изменения продукта.

# Словарь нормализации. Решение 1.2 записки: фиксируется до первого запроса
# к источникам и применяется единообразно. Пустой vendor или change_type
# ломает обязательные фильтры ретривала (FR-5.16, FR-6.13).
corpus:
  retention: forever

  # Целевой критерий готовности корпуса. Абсолютный объём (300 записей) не
  # предсказывает работоспособность ретривала: фильтры конъюнктивны, и решает
  # плотность на ячейку (vendor, change_type).
  readiness:
    min_statements: 300
    min_depth_days: 180
    min_vendors_with_dense_cell: 3
    min_events_per_dense_cell: 3
    dense_cell_change_types: [deprecation, breaking_change, pricing, limits]

  vendors:
    - id: anthropic
      label: "Anthropic"
      aliases: [Anthropic, claude, Claude, claude-code, "Claude Code", anthropics, "claude.ai"]
    - id: openai
      label: "OpenAI"
      aliases: [OpenAI, "Open AI", gpt, GPT, chatgpt, ChatGPT, openai-python]
    - id: cursor
      label: "Cursor"
      aliases: [Cursor, "Cursor IDE", anysphere, Anysphere]
    - id: n8n
      label: "n8n"
      aliases: [n8n, "n8n.io", "n8n-io"]
    - id: mcp
      label: "Model Context Protocol"
      aliases: [MCP, "Model Context Protocol", modelcontextprotocol, "MCP servers"]
    - id: google
      label: "Google"
      aliases: [Google, Gemini, gemini, "Google AI", "Vertex AI", vertex]
    # Голый «GitHub» из алиасов снят намеренно: нормализация ищет вхождение
    # подстроки, а ссылка на github.com стоит в каждом пункте релизов Zed,
    # Cline и Gemini CLI. С ним все их события ушли бы в корпус под чужим
    # вендором, и обнаружилось бы это уже после бэкфилла.
    - id: github
      label: "GitHub"
      aliases: ["GitHub Copilot", copilot, Copilot, "github.blog",
                "GitHub Actions", "GitHub API", "GitHub GraphQL"]
    - id: langchain
      label: "LangChain"
      aliases: [LangChain, langchain, LangGraph, langgraph, LangSmith]
    - id: llamaindex
      label: "LlamaIndex"
      aliases: [LlamaIndex, llamaindex, "llama-index", LlamaCloud]
    - id: crewai
      label: "CrewAI"
      aliases: [CrewAI, crewai, "Crew AI"]
    - id: pinecone
      label: "Pinecone"
      aliases: [Pinecone, pinecone]
    - id: temporal
      label: "Temporal"
      aliases: [Temporal, temporal, "Temporal.io", "temporal.io"]
    # AutoGen влит в Agent Framework: три вендора дали бы три полупустые
    # ячейки вместо одной плотной.
    - id: microsoft_ai
      label: "Microsoft AI"
      aliases: [Microsoft, "Semantic Kernel", "semantic-kernel", AutoGen, autogen,
                "Agent Framework", "agent-framework", "Azure OpenAI"]
    - id: weaviate
      label: "Weaviate"
      aliases: [Weaviate, weaviate]
    - id: chroma
      label: "Chroma"
      aliases: [Chroma, chroma, ChromaDB, chromadb, "trychroma"]
    - id: pydantic
      label: "Pydantic"
      aliases: [Pydantic, pydantic, "Pydantic AI", "pydantic-ai", PydanticAI]
    - id: qdrant
      label: "Qdrant"
      aliases: [Qdrant, qdrant]
    # Провайдеры моделей и инференса. Алиасы намеренно многосложные:
    # нормализация ищет вхождение подстроки, и односложные вроде Command
    # или Grok дают ложные срабатывания на посторонних словах.
    - id: together
      label: "Together AI"
      aliases: ["Together AI", "together.ai", TogetherAI, "Together Compute"]
    - id: groq
      label: "Groq"
      aliases: [Groq, GroqCloud, "groq.com"]
    - id: mistral
